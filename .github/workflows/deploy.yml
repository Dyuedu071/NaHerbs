name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata for backend
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/naherb-api
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Backend (naherb-api)
        uses: docker/build-push-action@v5
        with:
          context: ./naherb-api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract Docker metadata for frontend
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/naherb-web
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Frontend (naherb-web)
        uses: docker/build-push-action@v5
        with:
          context: ./naherb-web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_TINYMCE_API_KEY=${{ secrets.NEXT_PUBLIC_TINYMCE_API_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure deploy directory exists on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            mkdir -p ${{ secrets.VPS_DEPLOY_PATH }}
            mkdir -p ${{ secrets.VPS_DEPLOY_PATH }}/data/chatbot-knowledge

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          overwrite: true

      - name: Copy chatbot knowledge seed files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: content/chatbot-knowledge/*
          target: ${{ secrets.VPS_DEPLOY_PATH }}/data/chatbot-knowledge
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            docker compose pull naherb-api naherb-web
            docker compose up -d --remove-orphans --force-recreate naherb-api naherb-web
            docker compose up -d --remove-orphans redis nginx-proxy-manager

            echo "Waiting for app containers..."
            for i in $(seq 1 18); do
              API_STATE=$(docker inspect -f '{{.State.Status}}' naherb_api 2>/dev/null || echo missing)
              WEB_STATE=$(docker inspect -f '{{.State.Status}}' naherb_web 2>/dev/null || echo missing)
              API_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' naherb_api 2>/dev/null || echo missing)
              WEB_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' naherb_web 2>/dev/null || echo missing)
              echo "[$i] api=$API_STATE/$API_HEALTH web=$WEB_STATE/$WEB_HEALTH"
              if [ "$API_STATE" = "running" ] && [ "$WEB_STATE" = "running" ]; then
                break
              fi
              sleep 10
            done

            docker compose ps

            if [ "$(docker inspect -f '{{.State.Running}}' naherb_api 2>/dev/null || echo false)" != "true" ]; then
              echo "naherb_api is not running:"
              docker logs --tail 120 naherb_api || true
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' naherb_web 2>/dev/null || echo false)" != "true" ]; then
              echo "naherb_web is not running:"
              docker logs --tail 120 naherb_web || true
              docker logs --tail 80 naherb_api || true
              exit 1
            fi

            docker image prune -f
