name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main # Chạy action này mỗi khi có code được đẩy lên nhánh main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend (naherb-api)
        uses: docker/build-push-action@v5
        with:
          context: ./naherb-api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/naherb-api:latest

      - name: Build and Push Frontend (naherb-web)
        uses: docker/build-push-action@v5
        with:
          context: ./naherb-web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/naherb-web:latest
