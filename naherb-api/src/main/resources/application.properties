spring.application.name=naherb-api
spring.config.import=optional:file:.env.backend[.properties],optional:file:naherb-api/.env.backend[.properties]
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/naherb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=naherb
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Auth
app.security.jwt.secret=${JWT_SECRET:naherb-local-only-secret-change-me-2026}
app.security.jwt.issuer=${JWT_ISSUER:naherb-api}
app.security.jwt.expiration=${JWT_ACCESS_EXPIRATION:PT15M}
app.security.refresh.expiration=${REFRESH_TOKEN_EXPIRATION:P7D}
app.security.cookie.access-name=${ACCESS_COOKIE_NAME:NAHERB_ACCESS_TOKEN}
app.security.cookie.refresh-name=${REFRESH_COOKIE_NAME:NAHERB_REFRESH_TOKEN}
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# Actuator (Health check)
management.endpoints.web.base-path=/api/v1
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${OTP_MAIL_FROM:noreply@naherbs.vn}

# Google Auth
app.security.google.client-id=${GOOGLE_CLIENT_ID:}

# Bucket4j Rate Limiting Configuration
app.security.ratelimit.otp.capacity=1
app.security.ratelimit.otp.refill-tokens=1
app.security.ratelimit.otp.refill-duration=PT1M

app.security.ratelimit.login.capacity=3
app.security.ratelimit.login.refill-tokens=3
app.security.ratelimit.login.refill-duration=PT1M
