spring.application.name=naherb-api
spring.config.import=optional:file:.env.backend[.properties],optional:file:../.env.backend[.properties],optional:file:naherb-api/.env.backend[.properties]
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/naherb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=naherb
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:60000}
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000


# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Auth
app.security.jwt.secret=${JWT_SECRET:naherb-local-only-secret-change-me-2026}
app.security.jwt.issuer=${JWT_ISSUER:naherb-api}
app.security.jwt.expiration=${JWT_ACCESS_EXPIRATION:PT15M}
app.security.refresh.expiration=${REFRESH_TOKEN_EXPIRATION:P7D}
app.security.cookie.access-name=${ACCESS_COOKIE_NAME:NAHERB_ACCESS_TOKEN}
app.security.cookie.refresh-name=${REFRESH_COOKIE_NAME:NAHERB_REFRESH_TOKEN}
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# Actuator (Health check)
management.endpoints.web.base-path=/api/v1
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${OTP_MAIL_FROM:noreply@naherbs.vn}

# Google Auth
app.security.google.client-id=${GOOGLE_CLIENT_ID:}

# Bucket4j Rate Limiting Configuration
app.security.ratelimit.otp.capacity=1
app.security.ratelimit.otp.refill-tokens=1
app.security.ratelimit.otp.refill-duration=PT1M

app.security.ratelimit.login.capacity=3
app.security.ratelimit.login.refill-tokens=3
app.security.ratelimit.login.refill-duration=PT1M

# Multipart File Upload Limits
# Managed below using env variables

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# AI / Chatbot
app.ai.provider=${AI_PROVIDER:openai}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.chatbot.knowledge-path=${CHATBOT_KNOWLEDGE_PATH:../content/chatbot-knowledge}
app.chatbot.ingest-on-startup=${CHATBOT_INGEST_ON_STARTUP:true}
app.chatbot.rag-top-k=${RAG_TOP_K:14}
app.chatbot.rag-per-document-top-k=${RAG_PER_DOCUMENT_TOP_K:6}
app.chatbot.chunk-size=${RAG_CHUNK_SIZE:800}
app.chatbot.chunk-overlap=${RAG_CHUNK_OVERLAP:120}
app.chatbot.knowledge-max-upload-bytes=${CHATBOT_KNOWLEDGE_MAX_UPLOAD_BYTES:15728640}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:15MB}

app.upload.base-path=${UPLOAD_BASE_PATH:uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/api}
app.upload.max-avatar-bytes=${UPLOAD_MAX_AVATAR_BYTES:2097152}
