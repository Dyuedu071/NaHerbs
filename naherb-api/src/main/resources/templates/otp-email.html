<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận đăng ký tài khoản NaHerbs</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f3e7; margin: 0; padding: 20px; color: #1d1c14; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e8e2d6; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #37563b; font-family: 'Merriweather', serif; margin: 0; }
        .content { font-size: 16px; line-height: 1.5; }
        .otp-box { background: #e7f0e4; border: 1px solid #c7eccf; text-align: center; padding: 15px; font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #03210b; border-radius: 4px; margin: 20px 0; }
        .footer { font-size: 12px; color: #737971; text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NaHerbs</h1>
        </div>
        <div class="content">
            <p>Chào bạn,</p>
            <p>Cảm ơn bạn đã đăng ký tài khoản tại NaHerbs. Để hoàn tất quá trình đăng ký, vui lòng sử dụng mã xác thực (OTP) dưới đây:</p>
            <div class="otp-box" th:text="${otp}">123456</div>
            <p>Mã này sẽ hết hạn trong 5 phút.</p>
            <p>Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email này.</p>
        </div>
        <div class="footer">
            <p>© 2026 NaHerbs. Mọi quyền được bảo lưu.</p>
        </div>
    </div>
</body>
</html>
