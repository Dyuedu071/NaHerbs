spring.datasource.url=jdbc:h2:mem:naherb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.security.jwt.secret=naherb-test-secret-with-at-least-32-bytes
app.security.jwt.issuer=naherb-api-test
app.security.jwt.expiration=PT15M
app.security.refresh.expiration=P7D
app.security.cookie.access-name=NAHERB_ACCESS_TOKEN
app.security.cookie.refresh-name=NAHERB_REFRESH_TOKEN
app.security.cookie.secure=false
app.security.cookie.same-site=Lax
app.security.cors.allowed-origins=http://localhost:5173
