spring.datasource.url=jdbc:h2:mem:naherb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
management.health.redis.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=test@naherb.vn
app.security.google.client-id=test-google-client-id
app.security.ratelimit.login.capacity=1000
app.security.ratelimit.login.refill-tokens=1000
app.security.ratelimit.login.refill-duration=PT1S
app.security.ratelimit.otp.capacity=1000
app.security.ratelimit.otp.refill-tokens=1000
app.security.ratelimit.otp.refill-duration=PT1S
app.security.jwt.secret=naherb-test-secret-with-at-least-32-bytes
app.security.jwt.issuer=naherb-api-test
app.security.jwt.expiration=PT15M
app.security.refresh.expiration=P7D
app.security.cookie.access-name=NAHERB_ACCESS_TOKEN
app.security.cookie.refresh-name=NAHERB_REFRESH_TOKEN
app.security.cookie.secure=false
app.security.cookie.same-site=Lax
app.security.cors.allowed-origins=http://localhost:5173
app.chatbot.ingest-on-startup=false
app.chatbot.knowledge-path=src/test/resources/chatbot-knowledge
app.ai.api-key=test-openai-key
