            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M54.627 0l.83.83-53.797 53.8-.83-.83L54.627 0zM17.373 0l.83.83-16.544 16.543-.83-.83L17.373 0zM60 17.373l-.83.83L42.627 60l-.83-.83L59.17 17.373zM35.627 0l.83.83-34.797 34.8-.83-.83L35.627 0zM60 35.627l-.83.83L24.627 60l-.83-.83L59.17 35.627z' fill='%23E8D8BD' fill-opacity='0.2' fill-rule='evenodd'/%3E%3C/svg%3E");

<body class="bg-background herbal-pattern min-h-screen flex items-center justify-center p-sm md:p-md text-on-surface">
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <span class="material-symbols-outlined absolute text-soft-sage/5 text-[40px]"
            style="top: 10%; left: 5%; transform: rotate(15deg);">eco</span>
        <span class="material-symbols-outlined absolute text-herbal-beige/5 text-[32px]"
            style="top: 25%; right: 8%; transform: rotate(-20deg);">potted_plant</span>
        <span class="material-symbols-outlined absolute text-soft-sage/5 text-[48px]"
            style="bottom: 15%; left: 10%; transform: rotate(45deg);">spa</span>
        <span class="material-symbols-outlined absolute text-herbal-beige/5 text-[36px]"
            style="bottom: 20%; right: 12%; transform: rotate(-10deg);">psychiatry</span>
        <span class="material-symbols-outlined absolute text-soft-sage/5 text-[28px]"
            style="top: 60%; left: 3%; transform: rotate(30deg);">eco</span>
        <span class="material-symbols-outlined absolute text-herbal-beige/5 text-[44px]"
            style="top: 45%; right: 4%; transform: rotate(-35deg);">spa</span>
    </div>
    <div
        class="w-full max-w-md bg-surface-container-lowest rounded-xl organic-shadow p-gutter relative overflow-hidden z-10">
        <div class="text-center mb-lg">
            <h1 class="font-headline-lg hidden md:block text-headline-lg text-primary font-bold tracking-tight mb-xs">
                NaHerbs</h1>
            <h1
                class="font-headline-lg-mobile md:hidden text-headline-lg-mobile text-primary font-bold tracking-tight mb-xs">
                NaHerbs</h1>
            <p class="font-body-md text-body-md text-text-muted">Wellness Management Platform</p>
        </div>
        <form class="space-y-md">
            <div>
                <label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email / Số
                    điện thoại</label>
                <div class="relative">
                    <span
                        class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">person</span>
                    <input
                        class="w-full h-[42px] pl-lg pr-sm bg-surface border border-border-warm rounded-lg font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                        id="email" placeholder="Nhập email hoặc số điện thoại" type="text">
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-xs">
                    <label class="block font-label-md text-label-md text-on-surface-variant" for="password">Mật
                        khẩu</label>
                    <a class="font-caption text-caption text-primary hover:text-primary-container transition-colors"
                        href="#">Quên mật khẩu?</a>
                </div>
                <div class="relative">
                    <span
                        class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
                    <input
                        class="w-full h-[42px] pl-lg pr-lg bg-surface border border-border-warm rounded-lg font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"
                        id="password" placeholder="••••••••" type="password">
                    <button
                        class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none"
                        type="button">
                        <span class="material-symbols-outlined">visibility_off</span>
                    </button>
                </div>
            </div>
            <div class="pt-sm">
                <button
                    class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-full hover:bg-primary-container active:scale-[0.98] transition-all duration-150 organic-shadow"
                    type="submit">
                    Đăng nhập
                </button>
            </div>
            <div class="flex items-center gap-2 my-md">
                <div class="flex-1 h-px bg-border-warm"></div>
                <span class="text-caption font-caption text-text-muted">Hoặc</span>
                <div class="flex-1 h-px bg-border-warm"></div>
            </div>
            <button type="button"
                class="w-full h-12 bg-surface border border-border-warm text-on-surface font-label-md text-label-md rounded-full flex items-center justify-center gap-2 hover:bg-surface-container-low active:scale-[0.98] transition-all duration-150 organic-shadow">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z"
                        fill="#4285F4"></path>
                    <path
                        d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4205 9 14.4205C6.65591 14.4205 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z"
                        fill="#34A853"></path>
                    <path
                        d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29V4.95818H0.957275C0.347727 6.17318 0 7.54773 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z"
                        fill="#FBBC05"></path>
                    <path
                        d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z"
                        fill="#EA4335"></path>
                </svg>
                Đăng nhập với Google
            </button>
        </form>
        <div class="mt-lg text-center border-t border-border-warm pt-md">
            <p class="font-body-md text-body-md text-text-muted">
                Chưa có tài khoản?
                <a class="text-primary font-semibold hover:text-primary-container transition-colors" href="#">Đăng ký
                    ngay</a>
            </p>
        </div>
    </div>


</body>

</html>
