<body
    class="bg-background text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex items-center justify-center p-sm md:p-md">
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-[-1] opacity-[0.06]" aria-hidden="true"><svg
            class="absolute -top-20 -left-20 w-[600px] h-[600px] text-soft-sage" fill="currentColor"

        </svg><svg class="absolute -bottom-40 -right-20 w-[800px] h-[800px] text-herbal-beige" fill="currentColor"

        </svg><svg class="absolute bottom-1/4 -left-20 w-[400px] h-[400px] text-herbal-beige" fill="currentColor"

            <path d="M100,20 C110,50 150,70 150,110 C150,150 120,180 100,180 C80,180 50,150 50,110 C50,70 90,50 100,20"
                fill="currentColor"></path>
        </svg><svg
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] text-soft-sage opacity-40"
            fill="currentColor" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

                fill="currentColor"></path>

    <main class="w-full max-w-md">
        <!-- Auth Card -->
        <div
            class="bg-surface-container-lowest rounded-xl shadow-sm border border-herbal-beige p-lg flex flex-col items-center">
            <!-- Logo Area -->
            <div class="flex flex-col items-center mb-md w-full">
                <img class="h-16 w-16 object-contain mb-xs"
                    data-alt="A minimalist, modern logo design for a premium herbal and wellness brand named 'NaHerbs'. The logo features delicate, organic leaf motifs intertwined with elegant, clean typography. The color palette utilizes sophisticated deep forest greens against a pure white background, conveying trust, purity, and natural healing. High-resolution, crisp vector style."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdUdIPnmPwjFAlnYzsFrod8gw_Fi_LEz7tMBbOarhF2B5-5P_cv7JwEfAT9Wcj_NAHZ4pWG0TG_VDFgep8qzJam-li_Nf-SXCDXSlGwpfzLJ32BujozunXtZnDd8OhqcyoS1MVJri8HtnGl0OQmbzEEPnPYJoo7ER8pJ-QuokxxKuLqi19SZ1lUSOtKD0D4dz1z5bD9ul7fq35ixtL7XCUc4nJQRAtaKlolZrhXpez0_RS4ZtqzPxWUmUWnfmtlJoM09EsIuCfBhA">
                <h1 class="font-headline-md text-headline-md text-primary text-center">NaHerbs</h1>
                <p class="font-body-md text-body-md text-text-muted text-center mt-xs">Đăng ký để lưu giỏ hàng và theo
                    dõi đơn hàng dễ dàng hơn</p>
            </div>
            <!-- Form Area -->
            <form action="#" class="w-full flex flex-col gap-sm" method="POST">
                <div>
                    <label class="block font-label-md text-label-md text-text-main mb-xs" for="fullName">Full
                        Name</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none">person</span>
                        <input
                            class="organic-input w-full rounded-lg pl-10 pr-4 font-body-md text-body-md text-text-main placeholder:text-text-muted/60"
                            id="fullName" name="fullName" placeholder="Nguyễn Văn A" required="" type="text">
                    </div>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-text-main mb-xs" for="phone">Phone
                        Number</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none">call</span>
                        <input
                            class="organic-input w-full rounded-lg pl-10 pr-4 font-body-md text-body-md text-text-main placeholder:text-text-muted/60"
                            id="phone" name="phone" placeholder="0912 345 678" required="" type="tel">
                    </div>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-text-main mb-xs" for="email">Email</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none">mail</span>
                        <input
                            class="organic-input w-full rounded-lg pl-10 pr-4 font-body-md text-body-md text-text-main placeholder:text-text-muted/60"
                            id="email" name="email" placeholder="name@example.com" required="" type="email">
                    </div>
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-text-main mb-xs"
                        for="password">Password</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none">lock</span>
                        <input
                            class="organic-input w-full rounded-lg pl-10 pr-10 font-body-md text-body-md text-text-main placeholder:text-text-muted/60"
                            id="password" name="password" placeholder="••••••••" required="" type="password">
                        <button
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors focus:outline-none"
                            type="button">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- CTA -->
                <button
                    class="mt-xs w-full h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-full hover:bg-surface-tint hover:-translate-y-[2px] transition-all duration-300 shadow-sm flex items-center justify-center"
                    type="submit">
                    Đăng ký
                </button>
            </form>
            <!-- Login Link -->
            <div class="mt-md pt-sm border-t border-border-warm w-full text-center">
                <p class="font-body-md text-body-md text-text-muted">
                    Đã có tài khoản?
                    <a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors ml-1"
                        href="#">Đăng nhập</a>
                </p>
            </div>
        </div>
        <!-- Trust Indicators below card -->
        <div class="mt-md flex justify-center items-center gap-sm text-text-muted">
            <span class="material-symbols-outlined text-soft-sage"
                style="font-variation-settings: 'FILL' 1;">encrypted</span>
            <span class="font-caption text-caption">Thông tin của bạn được bảo mật an toàn</span>
        </div>
    </main>
