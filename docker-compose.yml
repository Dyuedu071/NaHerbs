services:
  redis:
    image: redis:7-alpine
    container_name: naherb_redis
    restart: unless-stopped
    command: /bin/sh -c "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
    env_file:
      - ./.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - naherb_network

  naherb-api:
    image: ${DOCKER_USERNAME}/naherb-api:latest
    container_name: naherb_api
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./data/chatbot-knowledge:/data/chatbot-knowledge
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - naherb_network

  naherb-web:
    image: ${DOCKER_USERNAME}/naherb-web:latest
    container_name: naherb_web
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3000
    depends_on:
      naherb-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - naherb_network

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      naherb-web:
        condition: service_started
      naherb-api:
        condition: service_started
    networks:
      - naherb_network

networks:
  naherb_network:
    driver: bridge

volumes:
  redis_data:
