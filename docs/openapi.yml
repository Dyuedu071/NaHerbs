openapi: 3.0.3
info:
  title: NaHerbs Website MVP API
  version: 2.0.0
  description: API contract for naherb-api used by naherb-web Next.js.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot API
  - url: https://api.naherbs.vn/api/v1
    description: Production API placeholder
tags:
  - name: Health
  - name: Public Products
  - name: Public Blog
  - name: SEO
  - name: Customer Auth
  - name: Cart
  - name: Checkout
  - name: Customer Orders
  - name: Chatbot
  - name: Admin Auth
  - name: Admin Products
  - name: Admin Orders
  - name: Admin Blog
  - name: Admin Chatbot
  - name: Admin Settings
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
  /site-settings/public:
    get:
      tags: [SEO]
      security: []
      summary: Get public site settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicSiteSettings'
  /product-categories:
    get:
      tags: [Public Products]
      security: []
      summary: List published product categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductCategorySummary'
  /products:
    get:
      tags: [Public Products]
      security: []
      summary: List published products
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: categorySlug
          schema: { type: string }
        - in: query
          name: need
          schema: { type: string }
        - in: query
          name: inStockOnly
          schema: { type: boolean }
        - in: query
          name: sort
          schema: { type: string, enum: [latest, price_asc, price_desc] }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductPage'
  /products/{slug}:
    get:
      tags: [Public Products]
      security: []
      summary: Get product detail by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
        '404': { $ref: '#/components/responses/NotFound' }
  /blog-posts:
    get:
      tags: [Public Blog]
      security: []
      summary: List published blog posts
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BlogPostPage'
  /blog-posts/{slug}:
    get:
      tags: [Public Blog]
      security: []
      summary: Get blog post detail
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BlogPostDetail'
        '404': { $ref: '#/components/responses/NotFound' }
  /seo/sitemap-data:
    get:
      tags: [SEO]
      security: []
      summary: Data for Next.js sitemap.ts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SitemapData'
  /auth/register:
    post:
      tags: [Customer Auth]
      security: []
      summary: Register customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResponse' }
  /auth/login:
    post:
      tags: [Customer Auth]
      security: []
      summary: Login customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResponse' }
  /auth/me:
    get:
      tags: [Customer Auth]
      summary: Get current customer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerProfile' }
  /cart:
    get:
      tags: [Cart]
      summary: Get current customer's cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      summary: Clear cart
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      summary: Remove cart item
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cart' }
  /checkout:
    post:
      tags: [Checkout]
      summary: Create order from cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CheckoutResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/my:
    get:
      tags: [Customer Orders]
      summary: List current customer's orders
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderPage' }
  /orders/my/{orderId}:
    get:
      tags: [Customer Orders]
      summary: Get current customer's order detail
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetail' }
  /chatbot/config/public:
    get:
      tags: [Chatbot]
      security: []
      summary: Get public chatbot config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicChatbotConfig' }
  /chatbot/conversations:
    post:
      tags: [Chatbot]
      security: []
      summary: Create chatbot conversation
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChatbotConversation' }
  /chatbot/messages:
    post:
      tags: [Chatbot]
      security: []
      summary: Send chatbot message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatbotMessageRequest' }
      responses:
        '200':
          description: Answer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChatbotMessageResponse' }
  /admin/auth/login:
    post:
      tags: [Admin Auth]
      security: []
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResponse' }
  /admin/products:
    get:
      tags: [Admin Products]
      summary: List products for admin
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductPage' }
    post:
      tags: [Admin Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProductRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductDetail' }
  /admin/products/{productId}:
    put:
      tags: [Admin Products]
      summary: Update product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProductRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [Admin Products]
      summary: Archive product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/products/{productId}/versions:
    post:
      tags: [Admin Products]
      summary: Create product version
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProductVersionRequest' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
  /admin/products/{productId}/skus:
    post:
      tags: [Admin Products]
      summary: Create product SKU
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProductSkuRequest' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
  /admin/product-skus/{skuId}:
    put:
      tags: [Admin Products]
      summary: Update SKU
      parameters:
        - in: path
          name: skuId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProductSkuRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/product-skus/{skuId}/stock:
    patch:
      tags: [Admin Products]
      summary: Update SKU stock
      parameters:
        - in: path
          name: skuId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStockRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/orders:
    get:
      tags: [Admin Orders]
      summary: List orders for admin
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: orderStatus
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - in: query
          name: paymentStatus
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - in: query
          name: paymentMethod
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderPage' }
  /admin/orders/{orderId}:
    get:
      tags: [Admin Orders]
      summary: Admin get order detail
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderDetail' }
  /admin/orders/{orderId}/status:
    patch:
      tags: [Admin Orders]
      summary: Update order status
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrderStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/orders/{orderId}/payment-status:
    patch:
      tags: [Admin Orders]
      summary: Manually update payment status, used for QR confirmation
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePaymentStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/blog-posts:
    get:
      tags: [Admin Blog]
      summary: List blog posts admin
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Admin Blog]
      summary: Create blog post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertBlogPostRequest' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
  /admin/chatbot/config:
    get:
      tags: [Admin Chatbot]
      summary: Get chatbot config
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      tags: [Admin Chatbot]
      summary: Update chatbot config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChatbotConfigRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/site-settings:
    get:
      tags: [Admin Settings]
      summary: Get site settings
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      tags: [Admin Settings]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSiteSettingsRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ApiError' }
    ApiResponseHealth:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                status: { type: string, example: UP }
    ApiError:
      type: object
      properties:
        field: { type: string, nullable: true }
        code: { type: string, nullable: true }
        message: { type: string }
    ProductStatus:
      type: string
      enum: [DRAFT, PUBLISHED, HIDDEN, ARCHIVED]
    SkuStatus:
      type: string
      enum: [ACTIVE, HIDDEN, OUT_OF_STOCK]
    StockStatus:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
    PaymentMethod:
      type: string
      enum: [COD, BANK_QR]
    PaymentStatus:
      type: string
      enum: [UNPAID, COD_PENDING, WAITING_BANK_TRANSFER, PAID, FAILED, REFUNDED]
    OrderStatus:
      type: string
      enum: [PENDING_CONFIRMATION, CONFIRMED, PACKING, SHIPPING, COMPLETED, CANCELLED]
    ProductCategorySummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
    ProductSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        shortDescription: { type: string, nullable: true }
        minSalePrice: { type: number }
        maxSalePrice: { type: number }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    ProductDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { $ref: '#/components/schemas/ProductCategorySummary' }
        shortDescription: { type: string }
        detailDescription: { type: string }
        usageInstruction: { type: string, nullable: true }
        safetyNote: { type: string, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ProductVersion' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        relatedProducts:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
    ProductVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayOrder: { type: integer }
        skus:
          type: array
          items: { $ref: '#/components/schemas/ProductSku' }
    ProductSku:
      type: object
      properties:
        id: { type: string, format: uuid }
        skuCode: { type: string }
        name: { type: string }
        color: { type: string, nullable: true }
        scent: { type: string, nullable: true }
        type: { type: string, nullable: true }
        originalPrice: { type: number, nullable: true }
        salePrice: { type: number }
        stockQuantity: { type: integer }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        status: { $ref: '#/components/schemas/SkuStatus' }
        thumbnailUrl: { type: string, nullable: true }
    ProductImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        altText: { type: string, nullable: true }
        isThumbnail: { type: boolean }
    RegisterRequest:
      type: object
      required: [fullName, password]
      properties:
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        password: { type: string, format: password }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/CustomerProfile' }
    CustomerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    AddCartItemRequest:
      type: object
      required: [skuId, quantity]
      properties:
        skuId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal: { type: number }
    CartItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        productName: { type: string }
        productSlug: { type: string }
        skuName: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        unitPrice: { type: number }
        quantity: { type: integer }
        lineTotal: { type: number }
        stockQuantity: { type: integer }
    CheckoutRequest:
      type: object
      required: [receiverName, receiverPhone, receiverAddress, paymentMethod]
      properties:
        receiverName: { type: string }
        receiverPhone: { type: string }
        receiverAddress: { type: string }
        note: { type: string, nullable: true }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
    CheckoutResponse:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        orderCode: { type: string }
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        totalAmount: { type: number }
        qrInstruction:
          $ref: '#/components/schemas/QrInstruction'
    QrInstruction:
      type: object
      nullable: true
      properties:
        bankName: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
        qrImageUrl: { type: string }
        transferContent: { type: string }
    OrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderCode: { type: string }
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }
    OrderPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            receiverName: { type: string }
            receiverPhone: { type: string }
            receiverAddress: { type: string }
            note: { type: string, nullable: true }
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderItem' }
            qrInstruction: { $ref: '#/components/schemas/QrInstruction' }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        productNameSnapshot: { type: string }
        skuNameSnapshot: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        lineTotal: { type: number }
    BlogPostSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
    BlogPostPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BlogPostSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    BlogPostDetail:
      allOf:
        - $ref: '#/components/schemas/BlogPostSummary'
        - type: object
          properties:
            content: { type: string }
            seoTitle: { type: string, nullable: true }
            seoDescription: { type: string, nullable: true }
            relatedProducts:
              type: array
              items: { $ref: '#/components/schemas/ProductSummary' }
    SitemapData:
      type: object
      properties:
        staticPages:
          type: array
          items: { type: string }
        products:
          type: array
          items: { $ref: '#/components/schemas/SitemapItem' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/SitemapItem' }
        blogPosts:
          type: array
          items: { $ref: '#/components/schemas/SitemapItem' }
    SitemapItem:
      type: object
      properties:
        slug: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }
    PublicSiteSettings:
      type: object
      properties:
        brandName: { type: string }
        hotline: { type: string, nullable: true }
        zaloUrl: { type: string, nullable: true }
        facebookUrl: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        defaultDisclaimer: { type: string, nullable: true }
    PublicChatbotConfig:
      type: object
      properties:
        enabled: { type: boolean }
        welcomeMessage: { type: string }
        disclaimer: { type: string }
        suggestedQuestions:
          type: array
          items: { type: string }
    CreateConversationRequest:
      type: object
      properties:
        sessionId: { type: string, nullable: true }
        sourcePage: { type: string, nullable: true }
    ChatbotConversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, nullable: true }
        status: { type: string }
    ChatbotMessageRequest:
      type: object
      required: [message]
      properties:
        conversationId: { type: string, format: uuid, nullable: true }
        sessionId: { type: string, nullable: true }
        message: { type: string }
        sourcePage: { type: string, nullable: true }
    ChatbotMessageResponse:
      type: object
      properties:
        conversationId: { type: string, format: uuid }
        answer: { type: string }
        disclaimer: { type: string, nullable: true }
        recommendedProducts:
          type: array
          items: { $ref: '#/components/schemas/RecommendedProduct' }
        suggestedActions:
          type: array
          items: { $ref: '#/components/schemas/SuggestedAction' }
    RecommendedProduct:
      type: object
      properties:
        productId: { type: string, format: uuid }
        skuId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        slug: { type: string }
        skuName: { type: string, nullable: true }
        salePrice: { type: number, nullable: true }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        thumbnailUrl: { type: string, nullable: true }
        reason: { type: string }
    SuggestedAction:
      type: object
      properties:
        type: { type: string, enum: [VIEW_PRODUCT, CREATE_LEAD, CONTACT_ZALO, CALL_HOTLINE] }
        label: { type: string }
        url: { type: string, nullable: true }
    UpsertProductRequest:
      type: object
      required: [name, slug, status]
      properties:
        categoryId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        slug: { type: string }
        shortDescription: { type: string, nullable: true }
        detailDescription: { type: string, nullable: true }
        usageInstruction: { type: string, nullable: true }
        safetyNote: { type: string, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
    UpsertProductVersionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        displayOrder: { type: integer, default: 0 }
        status: { type: string, enum: [ACTIVE, HIDDEN], default: ACTIVE }
    UpsertProductSkuRequest:
      type: object
      required: [versionId, skuCode, name, salePrice, stockQuantity, status]
      properties:
        versionId: { type: string, format: uuid }
        skuCode: { type: string }
        name: { type: string }
        color: { type: string, nullable: true }
        scent: { type: string, nullable: true }
        type: { type: string, nullable: true }
        originalPrice: { type: number, nullable: true }
        salePrice: { type: number }
        stockQuantity: { type: integer }
        status: { $ref: '#/components/schemas/SkuStatus' }
    UpdateStockRequest:
      type: object
      required: [stockQuantity]
      properties:
        stockQuantity: { type: integer, minimum: 0 }
        note: { type: string, nullable: true }
    UpdateOrderStatusRequest:
      type: object
      required: [orderStatus]
      properties:
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: string, nullable: true }
    UpdatePaymentStatusRequest:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        note: { type: string, nullable: true }
    UpsertBlogPostRequest:
      type: object
      required: [title, slug, content]
      properties:
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, nullable: true }
        content: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
    UpdateChatbotConfigRequest:
      type: object
      properties:
        enabled: { type: boolean }
        welcomeMessage: { type: string }
        disclaimer: { type: string }
        suggestedQuestions:
          type: array
          items: { type: string }
        fallbackMessage: { type: string }
    UpdateSiteSettingsRequest:
      type: object
      properties:
        hotline: { type: string, nullable: true }
        zaloUrl: { type: string, nullable: true }
        facebookUrl: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        bankName: { type: string, nullable: true }
        bankAccountName: { type: string, nullable: true }
        bankAccountNumber: { type: string, nullable: true }
        bankQrImageUrl: { type: string, nullable: true }
security:
  - bearerAuth: []
