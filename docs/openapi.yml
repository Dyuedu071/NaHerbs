openapi: 3.0.3
info:
  title: NaHerbs Website MVP API
  version: 2.2.0
  description: 'API contract for naherb-api (Spring Boot) used by naherb-web (Next.js).
    Updated for UUID IDs across accounts/profile/address/order/cart and Vietnam two-level
    address fields: province/city and ward/commune only.'
servers:
- url: http://localhost:8080/api/v1
  description: Local Spring Boot API
- url: https://api.naherbs.vn/api/v1
  description: Production API placeholder
tags:
- name: Health
- name: Public Products
- name: Public Blog
- name: SEO
- name: Customer Auth
- name: Customer Profile
- name: Customer Addresses
- name: Cart
- name: Checkout
- name: Customer Orders
- name: Chatbot
- name: Admin Auth
- name: Admin Products
- name: Admin Orders
- name: Admin Blog
- name: Admin Chatbot
- name: Admin Settings
paths:
  /health:
    get:
      tags:
      - Health
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
  /site-settings/public:
    get:
      tags:
      - SEO
      security: []
      summary: Get public site settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PublicSiteSettings'
  /product-categories:
    get:
      tags:
      - Public Products
      security: []
      summary: List published product categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductCategorySummary'
  /products:
    get:
      tags:
      - Public Products
      security: []
      summary: List published products
      parameters:
      - in: query
        name: keyword
        schema:
          type: string
      - in: query
        name: categorySlugs
        schema:
          type: array
          items:
            type: string
        explode: true
      - in: query
        name: minPrice
        schema:
          type: number
      - in: query
        name: maxPrice
        schema:
          type: number
      - in: query
        name: inStockOnly
        schema:
          type: boolean
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - latest
          - price_asc
          - price_desc
      - in: query
        name: page
        schema:
          type: integer
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          default: 12
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductPage'
  /products/{slug}:
    get:
      tags:
      - Public Products
      security: []
      summary: Get product detail by slug
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /blog-posts:
    get:
      tags:
      - Public Blog
      security: []
      summary: List published blog posts
      parameters:
      - in: query
        name: keyword
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BlogPostPage'
  /blog-posts/{slug}:
    get:
      tags:
      - Public Blog
      security: []
      summary: Get blog post detail
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BlogPostDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /seo/sitemap-data:
    get:
      tags:
      - SEO
      security: []
      summary: Data for Next.js sitemap.ts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SitemapData'
  /auth/register:
    post:
      tags:
      - Customer Auth
      security: []
      summary: Register customer account and initialize profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthResponse'
      description: Creates an account used for authentication. Profile/contact 
        details are stored separately in account_profiles and account_addresses.
  /auth/login:
    post:
      tags:
      - Customer Auth
      security: []
      summary: Login customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthResponse'
  /auth/me:
    get:
      tags:
      - Customer Profile
      summary: Get current account and profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
  /cart:
    get:
      tags:
      - Cart
      summary: Get current customer's cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
    delete:
      tags:
      - Cart
      summary: Clear cart
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /cart/items:
    post:
      tags:
      - Cart
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
        '409':
          $ref: '#/components/responses/Conflict'
  /cart/items/{itemId}:
    patch:
      tags:
      - Cart
      summary: Update cart item quantity
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
    delete:
      tags:
      - Cart
      summary: Remove cart item
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Cart'
  /checkout:
    post:
      tags:
      - Checkout
      summary: Create order from cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CheckoutResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/my:
    get:
      tags:
      - Customer Orders
      summary: List current customer's orders
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderPage'
  /orders/my/{orderId}:
    get:
      tags:
      - Customer Orders
      summary: Get current customer's order detail
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
  /chatbot/config/public:
    get:
      tags:
      - Chatbot
      security: []
      summary: Get public chatbot config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PublicChatbotConfig'
  /chatbot/conversations:
    post:
      tags:
      - Chatbot
      security: []
      summary: Create chatbot conversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ChatbotConversation'
  /chatbot/messages:
    post:
      tags:
      - Chatbot
      security: []
      summary: Send chatbot message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotMessageRequest'
      responses:
        '200':
          description: Answer
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ChatbotMessageResponse'
  /chatbot/messages/stream:
    post:
      tags:
      - Chatbot
      security: []
      summary: Stream chatbot message (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotMessageRequest'
      responses:
        '200':
          description: Server-sent events (meta, token, done, error)
          content:
            text/event-stream:
              schema:
                type: string
  /admin/auth/login:
    post:
      tags:
      - Admin Auth
      security: []
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthResponse'
  /admin/products:
    get:
      tags:
      - Admin Products
      summary: List products for admin
      parameters:
      - in: query
        name: keyword
        schema:
          type: string
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - in: query
        name: page
        schema:
          type: integer
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductPage'
    post:
      tags:
      - Admin Products
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductDetail'
  /admin/products/{productId}:
    put:
      tags:
      - Admin Products
      summary: Update product
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags:
      - Admin Products
      summary: Archive product
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/products/{productId}/versions:
    post:
      tags:
      - Admin Products
      summary: Create product version
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductVersionRequest'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /admin/products/{productId}/skus:
    post:
      tags:
      - Admin Products
      summary: Create product SKU
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductSkuRequest'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /admin/product-skus/{skuId}:
    put:
      tags:
      - Admin Products
      summary: Update SKU
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProductSkuRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/product-skus/{skuId}/stock:
    patch:
      tags:
      - Admin Products
      summary: Update SKU stock
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/orders:
    get:
      tags:
      - Admin Orders
      summary: List orders for admin
      parameters:
      - in: query
        name: keyword
        schema:
          type: string
      - in: query
        name: orderStatus
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - in: query
        name: paymentStatus
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      - in: query
        name: paymentMethod
        schema:
          $ref: '#/components/schemas/PaymentMethod'
      - in: query
        name: page
        schema:
          type: integer
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderPage'
  /admin/orders/{orderId}:
    get:
      tags:
      - Admin Orders
      summary: Admin get order detail
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetail'
  /admin/orders/{orderId}/status:
    patch:
      tags:
      - Admin Orders
      summary: Update order status
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/orders/{orderId}/payment-status:
    patch:
      tags:
      - Admin Orders
      summary: Manually update payment status, used for QR confirmation
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/blog-posts:
    get:
      tags:
      - Admin Blog
      summary: List blog posts admin
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags:
      - Admin Blog
      summary: Create blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBlogPostRequest'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
  /admin/chatbot/config:
    get:
      tags:
      - Admin Chatbot
      summary: Get chatbot config
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags:
      - Admin Chatbot
      summary: Update chatbot config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatbotConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/chatbot/knowledge:
    get:
      tags:
      - Admin Chatbot
      summary: List chatbot knowledge markdown files
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags:
      - Admin Chatbot
      summary: Upload chatbot knowledge markdown file
      parameters:
      - name: replace
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          $ref: '#/components/responses/Ok'
    delete:
      tags:
      - Admin Chatbot
      summary: Delete chatbot knowledge file by source path
      parameters:
      - name: sourcePath
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/chatbot/knowledge/{documentId}:
    delete:
      tags:
      - Admin Chatbot
      summary: Delete chatbot knowledge document by id
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /admin/site-settings:
    get:
      tags:
      - Admin Settings
      summary: Get site settings
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags:
      - Admin Settings
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteSettingsRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /account/profile:
    get:
      tags:
      - Customer Profile
      summary: Get current account profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AccountProfile'
    put:
      tags:
      - Customer Profile
      summary: Update current account profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AccountProfile'
  /account/profile/avatar:
    post:
      tags:
      - Customer Profile
      summary: Upload profile avatar image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AccountProfile'
  /account/addresses:
    get:
      tags:
      - Customer Addresses
      summary: List current account shipping addresses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AccountAddress'
    post:
      tags:
      - Customer Addresses
      summary: Create shipping address for current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AccountAddress'
  /account/addresses/{addressId}:
    put:
      tags:
      - Customer Addresses
      summary: Update shipping address
      parameters:
      - in: path
        name: addressId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAddressRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AccountAddress'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Customer Addresses
      summary: Delete shipping address
      parameters:
      - in: path
        name: addressId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'
  /account/addresses/{addressId}/default:
    patch:
      tags:
      - Customer Addresses
      summary: Set address as default
      parameters:
      - in: path
        name: addressId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/google:
    post:
      tags:
      - auth
      summary: Login or Register with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - idToken
              properties:
                idToken:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
  /auth/register-otp:
    post:
      tags:
      - auth
      summary: Send OTP for registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    ApiResponseHealth:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              status:
                type: string
                example: UP
    ApiError:
      type: object
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        message:
          type: string
    ProductStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - HIDDEN
      - ARCHIVED
    SkuStatus:
      type: string
      enum:
      - ACTIVE
      - HIDDEN
      - OUT_OF_STOCK
    StockStatus:
      type: string
      enum:
      - IN_STOCK
      - LOW_STOCK
      - OUT_OF_STOCK
    PaymentMethod:
      type: string
      enum:
      - COD
      - BANK_QR
    PaymentStatus:
      type: string
      enum:
      - UNPAID
      - COD_PENDING
      - WAITING_BANK_TRANSFER
      - PAID
      - FAILED
      - REFUNDED
    OrderStatus:
      type: string
      enum:
      - PENDING_CONFIRMATION
      - CONFIRMED
      - PACKING
      - SHIPPING
      - COMPLETED
      - CANCELLED
    ProductCategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
    ProductSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        shortDescription:
          type: string
          nullable: true
        minSalePrice:
          type: number
        maxSalePrice:
          type: number
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        skuCode:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        categorySlug:
          type: string
          nullable: true
        skuCount:
          type: integer
        totalStockQuantity:
          type: integer
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    ProductDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        category:
          $ref: '#/components/schemas/ProductCategorySummary'
        shortDescription:
          type: string
        detailDescription:
          type: string
        usageInstruction:
          type: string
          nullable: true
        safetyNote:
          type: string
          nullable: true
        seoTitle:
          type: string
          nullable: true
        seoDescription:
          type: string
          nullable: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProductVersion'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        relatedProducts:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
    ProductVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayOrder:
          type: integer
        skus:
          type: array
          items:
            $ref: '#/components/schemas/ProductSku'
    ProductSku:
      type: object
      properties:
        id:
          type: string
          format: uuid
        skuCode:
          type: string
        name:
          type: string
        color:
          type: string
          nullable: true
        scent:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        originalPrice:
          type: number
          nullable: true
        salePrice:
          type: number
        stockQuantity:
          type: integer
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        status:
          $ref: '#/components/schemas/SkuStatus'
        thumbnailUrl:
          type: string
          nullable: true
    ProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        altText:
          type: string
          nullable: true
        isThumbnail:
          type: boolean
    RegisterRequest:
      type: object
      description: Creates an account for authentication. User profile data is 
        stored separately in account_profiles.
      required:
      - email
      - password
      - name
      - otp
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string
          maxLength: 100
          description: Display name stored on accounts to match current Account 
            entity; profile stores customer contact data. It should also 
            initialize profile.fullName.
        phone:
          type: string
          nullable: true
          description: Optional initial profile phone.
        otp:
          type: string
          example: '123456'
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/CurrentUser'
    CustomerProfile:
      type: object
      deprecated: true
      description: Deprecated. Use CurrentUser or AccountProfile. accountId is 
        UUID.
      properties:
        accountId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
    AddCartItemRequest:
      type: object
      required:
      - skuId
      - quantity
