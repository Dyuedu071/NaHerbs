        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        productName:
          type: string
        productSlug:
          type: string
        skuName:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        unitPrice:
          type: number
        quantity:
          type: integer
        lineTotal:
          type: number
        stockQuantity:
          type: integer
    CheckoutRequest:
      type: object
      description: Create order from current cart. Use either shippingAddressId 
        from saved account_addresses or provide shippingAddress inline. Address 
        uses province/city and ward/commune only; no district field.
      required:
      - paymentMethod
      properties:
        shippingAddressId:
          type: string
          format: uuid
          nullable: true
        shippingAddress:
          allOf:
          - $ref: '#/components/schemas/UpsertAddressRequest'
          nullable: true
        saveAddress:
          type: boolean
          default: false
          description: If true and shippingAddress is provided, backend may save
            it to account_addresses.
        note:
          type: string
          nullable: true
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    CheckoutResponse:
      type: object
      properties:
